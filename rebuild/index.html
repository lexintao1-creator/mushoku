<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="非官方同人项目"><title>无职转生：初行之章</title><link rel="preload" as="image" href="assets/ui13/panels.png"><link rel="preload" as="image" href="assets/ui13/icons.png"><link rel="stylesheet" href="play.css"></head>
<body>
<main id="game" aria-label="游戏场景"></main>
<div id="loading" role="status"><div class="loading-inner"><small>六面世界</small><h1>無職転生</h1><p>初行之章</p><div class="loading-track" role="progressbar" aria-label="加载" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="loading-progress"></i></div><span id="loading-percent">0%</span></div></div>
<header id="hud" data-qa="hud"><div class="vitals"><strong id="name">鲁迪</strong><span id="hp-text"></span><div class="meter"><i id="hp"></i></div><div class="meter mana"><i id="mp"></i></div></div><div class="place"><span id="area"></span><small id="objective"></small></div><button id="menu" type="button" aria-label="菜单" title="菜单"><i data-lucide="menu" aria-hidden="true"></i></button></header>
<div id="prompt" hidden><button id="interact" type="button"></button></div><div id="message" role="status"></div>
<aside id="minimap" aria-label="小地图"><canvas id="minimap-canvas" width="368" height="264"></canvas><span class="map-north" aria-hidden="true">N</span></aside>
<nav id="utility-rail" aria-label="角色菜单"><button type="button" aria-disabled="true" data-ui-zh="背包" data-ui-ja="所持品" title="背包" aria-label="背包"><i data-lucide="backpack" aria-hidden="true"></i></button><button type="button" aria-disabled="true" data-ui-zh="强化" data-ui-ja="強化" title="强化" aria-label="强化"><i data-lucide="hammer" aria-hidden="true"></i></button><button type="button" aria-disabled="true" data-ui-zh="角色" data-ui-ja="キャラクター" title="角色" aria-label="角色"><i data-lucide="user-round" aria-hidden="true"></i></button></nav>
<nav id="skill-dock" aria-label="魔术"><div id="spell" data-qa="spell-dock"><button id="water-cast" type="button" class="spell-current" aria-label="水术蓄力" title="塑形并保持" aria-pressed="false" data-qa="water-cast"><i data-lucide="droplet" aria-hidden="true"></i><span id="spell-name">水弹</span><i id="ready"></i></button><button id="major-spell" type="button" hidden disabled aria-pressed="false" aria-label="豪雷" title="豪雷" data-label-zh="豪雷" data-label-ja="豪雷積層雲" data-qa="major-spell"><i data-lucide="cloud-lightning" aria-hidden="true"></i><span data-label>豪雷</span></button></div>
<div id="skill-reserve" aria-label="技能栏"><button type="button" aria-disabled="true" data-ui-zh="火术" data-ui-ja="火魔術" title="火术" aria-label="火术"><i data-lucide="flame" aria-hidden="true"></i></button><button type="button" aria-disabled="true" data-ui-zh="风术" data-ui-ja="風魔術" title="风术" aria-label="风术"><i data-lucide="wind" aria-hidden="true"></i></button><button type="button" aria-disabled="true" data-ui-zh="土术" data-ui-ja="土魔術" title="土术" aria-label="土术"><i data-lucide="mountain" aria-hidden="true"></i></button></div>
</nav><div id="charging" hidden><span id="charging-label">塑形</span><div><i id="charging-progress"></i></div></div>
<section id="overlay" hidden><div class="menu-inner"><h1 id="menu-title">旅途暂歇</h1><button id="resume">返回旅途</button><label><span id="language-label">语言</span><select id="language"><option value="zh">中文</option><option value="ja">日本語</option></select></label><label><span id="volume-label">音量</span><input id="volume" type="range" min="0" max="1" step=".05" value=".35"></label><label><span id="touch-label">触控</span><input id="touch-toggle" type="checkbox"></label><label><span id="light-label">照明</span><input id="light-toggle" type="checkbox" checked></label>
<label><span id="chant-label">原创咏唱演出</span><input id="chant-toggle" type="checkbox"></label>
</div></section>
<section id="dialog" hidden><div><small id="speaker"></small><p id="line"></p><button id="dialog-close">继续旅途</button></div></section>
<div id="touch" hidden><div id="stick" aria-label="移动"><i></i></div><div id="aim-pad" aria-label="拖曳瞄准并施法"><i data-lucide="droplet" aria-hidden="true"></i></div><button id="dodge"><i data-lucide="rotate-ccw" aria-hidden="true"></i><span data-label>闪避</span></button><button id="touch-e"><i data-lucide="hand" aria-hidden="true"></i><span data-label>交互</span></button></div>
<script type="module" src="ui/skin.mjs"></script><script src="../assets/lucide.min.js"></script><script src="../assets/phaser.min.js"></script><script type="module" src="play.mjs"></script>
</body></html>
